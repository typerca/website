<meta property="og:title" content="TypeRCA: game days for AI incident agents">
<meta property="og:description" content="Test how they investigate, decide, and act, before a real outage does.">

<meta property="og:image" content="https://typerca.io/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c0d0f'/%3E%3Cpath d='M9 22 L15 10 L17 16 L23 16' fill='none' stroke='%2358d39b' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --sans:"Geist", ui-sans-serif, system-ui, sans-serif;
  --mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --bg:#0c0d0f;
  --panel:#131417;
  --panel-2:#1a1b1f;
  --line:#26272c;
  --text:#f3f4f5;
  --dim:#a1a3aa;
  --faint:#8b8e96;
  --accent:#58d39b;     /* verified, and the step we're on */
  --warn:#e8836b;       /* failed checks and regressions */
  --btn-bg:#f3f4f5; --btn-fg:#0c0d0f;

  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --wrap:1120px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f6f6f4; --panel:#ffffff; --panel-2:#efefec; --line:#dcdcd7;
    --text:#131417; --dim:#55575e; --faint:#6b6e76; --accent:#0e7d52; --warn:#b4452c;
    --btn-bg:#131417; --btn-fg:#f6f6f4;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
code,pre{font-family:var(--mono)}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.ok{color:var(--accent)}
.no{color:var(--warn)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.top{border-bottom:1px solid var(--line)}
.top .wrap{height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font:600 19px/1 var(--sans);letter-spacing:-.03em;text-decoration:none}
.brand svg{width:26px;height:26px}
.top .wrap>nav{display:flex;align-items:center;gap:26px;font:500 14px var(--sans);color:var(--dim)}
.top .wrap>nav a{text-decoration:none}
.top .wrap>nav a:hover{color:var(--text)}
.top .wrap>nav a.cta{color:var(--text);border:1px solid var(--line);border-radius:var(--r-md);padding:7px 12px;white-space:nowrap}
.top .wrap>nav a.cta:hover{background:var(--panel-2)}
.menu{display:none;width:40px;height:36px;border:1px solid var(--line);border-radius:var(--r-md);background:none;cursor:pointer;padding:0;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.menu span{display:block;width:16px;height:1.5px;background:var(--text);transition:transform .15s}
.menu[aria-expanded="true"] span:first-child{transform:translateY(3.25px) rotate(45deg)}
.menu[aria-expanded="true"] span:last-child{transform:translateY(-3.25px) rotate(-45deg)}
.mnav{display:block;border-top:1px solid var(--line);padding:6px 16px 10px}
.mnav[hidden]{display:none}
.mnav a{display:block;padding:12px 0;font:500 17px var(--sans);text-decoration:none;border-bottom:1px solid var(--line)}
.mnav a:last-child{border-bottom:0}

/* ---------- hero ---------- */
.hero{text-align:center;padding:96px 0 0}
.strip{display:inline-flex;align-items:center;gap:10px;font:400 15px var(--sans);color:var(--dim)}
.strip b{font:500 13px var(--mono);color:var(--text);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px 8px;letter-spacing:0}
h1{font:500 clamp(44px,7.4vw,80px)/1.02 var(--sans);letter-spacing:-.045em;margin:22px auto 0;max-width:14ch;text-wrap:balance}
.sub{font-size:clamp(19px,2.1vw,23px);line-height:1.45;color:var(--text);max-width:34ch;text-wrap:balance;margin:24px auto 0}
.blurb{font-size:17px;line-height:1.6;color:var(--dim);max-width:60ch;text-wrap:balance;margin:18px auto 0}
.ctas{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:36px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:210px;height:52px;padding:0 22px;border-radius:var(--r-md);font:500 17px var(--sans);letter-spacing:-.01em;text-decoration:none;white-space:nowrap;transition:transform .12s,background .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--btn-bg);color:var(--btn-fg)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{background:var(--panel-2)}
.fine{font:400 13.5px var(--mono);color:var(--faint);margin:22px auto 0;text-wrap:balance}

/* hero: real verdicts */
.tick{max-width:720px;margin:40px auto 0;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);padding:14px 20px;text-align:left}
.tick-k{display:block;font:400 12px var(--mono);color:var(--faint);margin-bottom:6px}
.tick-line{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font:400 14.5px var(--mono);min-height:44px;transition:opacity .35s}
.tick-line.out{opacity:0}
.tq{color:var(--text)}
.ta{color:var(--faint)}
.tv{font-weight:600;letter-spacing:.02em}
.tv.hm{color:var(--text)}
.tw{color:var(--dim);font-family:var(--sans)}

/* ---------- sections ---------- */
section{padding:136px 0 0;scroll-margin-top:12px}
h2{font:500 clamp(32px,4.4vw,48px)/1.08 var(--sans);letter-spacing:-.04em;margin:0;max-width:22ch;text-wrap:balance}
.lead{font-size:18px;color:var(--dim);max-width:60ch;margin:18px 0 0}
.lead b{color:var(--text);font-weight:500}
.label{display:inline-block;font:500 12.5px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px 8px}

/* problem cards */
.three{list-style:none;margin:44px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.three li{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);padding:24px}
.three h3{font:600 20px/1.25 var(--sans);letter-spacing:-.025em;margin:0 0 10px}
.three p{margin:0;color:var(--dim);font-size:15.5px}

/* trust path */
.path{list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;counter-reset:s}
.path li{position:relative;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);padding:20px 18px 22px}
.path li::before{counter-increment:s;content:counter(s);font:500 13px var(--mono);color:var(--faint)}
.path li:not(:last-child)::after{content:"";position:absolute;top:50%;right:-13px;width:13px;height:1px;background:var(--faint)}
.path h3{font:600 17px/1.25 var(--sans);letter-spacing:-.02em;margin:8px 0 8px}
.path p{margin:0;color:var(--dim);font-size:14.5px;line-height:1.5}
.path .tag{display:inline-block;margin-top:14px;font:500 12px var(--mono);color:var(--faint)}
.path li.now{border-color:var(--accent)}
.path li.now h3,.path li.now .tag{color:var(--accent)}

/* game day */
/* game day architecture */
.arch{--g:30px;--fr:calc((100% - 4 * var(--g)) / 5.9);position:relative;margin-top:44px;display:grid;grid-template-columns:1fr var(--g) 1fr var(--g) 1fr var(--g) 1.9fr var(--g) 1fr;grid-template-rows:auto auto auto;align-items:stretch}
.an{grid-row:2;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;line-height:1.45;transition:border-color .35s,box-shadow .35s,opacity .35s;opacity:.55}
.an.on{opacity:1;border-color:var(--faint)}
.an.hot{border-color:var(--text);box-shadow:0 0 0 3px color-mix(in srgb,var(--text) 10%,transparent)}
.an b{font-weight:600;font-size:15.5px;letter-spacing:-.01em;line-height:1.3}
.ak{font:500 12px var(--mono);color:var(--faint);letter-spacing:.01em}
.as{color:var(--dim)}
.eg{margin-top:auto;padding-top:10px;font:500 12px var(--mono);color:var(--faint)}
.eg.no{color:var(--warn)}
.an.you{border-style:dashed}
.core{gap:10px}
.core .sb{border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.core .sb b{font-size:14.5px}
.qs{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px}
.qs li{display:flex;justify-content:space-between;gap:10px;font:400 12.5px var(--mono);color:var(--dim);opacity:0;transform:translateY(3px);transition:opacity .3s,transform .3s}
.qs li.on{opacity:1;transform:none}
.qs em{font-style:normal;font-weight:600}
.vd{margin-top:8px;font:600 13px var(--mono);color:var(--warn);opacity:0;transition:opacity .35s}
.vd span{display:block;font:400 12px var(--sans);color:var(--dim);margin-top:2px}
.vd.on{opacity:1}
.cn{grid-row:2;position:relative;display:flex;align-items:center}
.cn i{position:relative;display:block;width:100%;height:1px;background:var(--line)}
.cn i::after{content:"";position:absolute;right:-1px;top:-3px;border:3.5px solid transparent;border-left:5px solid var(--line);border-right:0}
.cn i::before{content:"";position:absolute;left:0;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--text);opacity:0}
.cn.on i{background:var(--faint)}
.cn.on i::before{animation:travel .9s ease-in-out forwards}
@keyframes travel{0%{left:0;opacity:1}90%{opacity:1}100%{left:calc(100% - 7px);opacity:0}}
.cn em{position:absolute;top:calc(50% + 8px);left:50%;transform:translateX(-50%);font:400 11px var(--mono);color:var(--faint);font-style:normal;white-space:nowrap;writing-mode:horizontal-tb;background:var(--bg);padding:0 2px;z-index:1}
.arc-top,.arc-bot{grid-column:1/-1;position:relative;height:34px;font:400 12px var(--mono);color:var(--faint);transition:color .35s}
.arc-top::before,.arc-bot::before{content:"";position:absolute;left:calc(var(--fr) * .5);border:1px dashed var(--line);transition:border-color .35s}
.arc-top::before{top:12px;bottom:0;width:calc(var(--fr) * 3.45 + 3 * var(--g));border-bottom:0;border-radius:10px 10px 0 0}
.arc-bot::before{top:0;bottom:12px;left:calc(var(--fr) * 2.5 + 2 * var(--g));width:calc(var(--fr) * 2.9 + 2 * var(--g));border-top:0;border-radius:0 0 10px 10px}
.arc-top span,.arc-bot span{position:absolute;left:calc(var(--fr) * 1.6 + var(--g));background:var(--bg);padding:0 8px}
.arc-top span{top:4px}
.arc-bot span{bottom:3px;left:calc(var(--fr) * 3.5 + 3 * var(--g))}
.arc-top.on,.arc-bot.on{color:var(--text)}
.arc-top.on::before,.arc-bot.on::before{border-color:var(--faint)}
.mob{display:none}
@media (max-width:900px){
  .arch{grid-template-columns:minmax(0,1fr);grid-template-rows:none}
  .an,.cn{grid-row:auto}
  .arc-top,.arc-bot{display:none}
  .cn{height:30px;justify-content:center}
  .cn i{width:1px;height:100%}
  .cn i::after{right:auto;left:-3px;top:auto;bottom:-1px;border:3.5px solid transparent;border-top:5px solid var(--line);border-bottom:0}
  .cn i::before{left:-3px;top:0}
  .cn.on i::before{animation:drop .7s ease-in-out forwards}
  @keyframes drop{0%{top:0;opacity:1}90%{opacity:1}100%{top:calc(100% - 7px);opacity:0}}
  .cn em{top:50%;left:calc(50% + 12px);transform:translateY(-50%)}
  .mob{display:block;font:400 12px var(--mono);color:var(--faint)}
  .loopnote{margin:12px 0 0;text-align:center}
}
@media (prefers-reduced-motion:reduce){.an{opacity:1}.qs li,.vd{opacity:1;transform:none}}
.real{margin-top:72px;scroll-margin-top:12px}
.real h3{font:500 clamp(24px,3vw,32px)/1.15 var(--sans);letter-spacing:-.035em;margin:0}
.motto-line{margin:22px 0 0;font-size:15.5px;color:var(--dim);max-width:72ch}
.motto-line b{color:var(--text);font-weight:600}
.shadow-note{margin:22px 0 0;padding:18px 22px;border:1px dashed var(--line);border-radius:var(--r-lg);font-size:15.5px;color:var(--dim);max-width:none}
.shadow-note b{color:var(--text);font-weight:600}
.shadow-note .ok,.shadow-note .no{font:500 13.5px var(--mono)}

/* regression report */
.report{margin-top:48px}
.tbl{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);overflow:hidden}
table{border-collapse:collapse;width:100%;font:400 15px var(--sans)}
th{font:400 13px var(--mono);color:var(--faint);text-align:right;padding:14px 20px 12px 8px}
th:first-child,td:first-child{text-align:left;padding-left:22px}
td{padding:14px 20px 14px 8px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
td:first-child{color:var(--text)}
td.better{color:var(--text)}
td.worse{color:var(--warn);font-weight:500}
td.chg{font:500 12.5px var(--mono);white-space:nowrap}
.regress{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px 20px;padding:18px 22px;border-top:1px solid var(--line);background:var(--panel-2)}
.regress b{font:600 15px var(--mono);color:var(--warn);letter-spacing:.02em}
.regress span{color:var(--dim);font-size:15px;max-width:62ch}
.rhead{padding:14px 22px;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--dim)}
.label.ok-l{color:var(--accent);border-color:var(--accent);margin-right:6px}
h3.minor{font:500 19px var(--sans);letter-spacing:-.02em;margin:40px 0 14px}
.punch{font:500 clamp(22px,2.6vw,28px)/1.25 var(--sans);letter-spacing:-.03em;margin:28px 0 0;max-width:34ch;text-wrap:balance}

/* origin */
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px}
.fact{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);padding:22px}
.fact .big{font:500 36px/1 var(--sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.fact .big.ok{color:var(--accent)}
.fact p{margin:10px 0 0;color:var(--dim);font-size:15px}
.more{display:inline-block;margin-top:22px;font:500 16px var(--sans);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px}
.more:hover{border-color:var(--text)}
.limits{margin:16px 0 0;font-size:14.5px;color:var(--faint);max-width:72ch;text-wrap:pretty}

/* live replay */
.live{margin-top:28px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);overflow:hidden}
.live-bar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);font:400 13px var(--mono);color:var(--faint)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.live-act{margin-left:auto;display:flex;gap:8px}
.live-act button{font:500 13px var(--sans);color:var(--dim);background:none;border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 10px;cursor:pointer;white-space:nowrap}
.live-act button:hover{color:var(--text)}
.live-alert{margin:0;padding:12px 18px;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--dim);min-height:47px}
.live-alert b{color:var(--warn);font:500 12px var(--mono);margin-right:8px;letter-spacing:.04em}
.live-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.live-map{display:block;width:100%;height:auto;max-height:340px;padding:14px;border-right:1px solid var(--line)}
.live-map .edge{stroke:var(--line);stroke-width:1.2}
.live-map rect{fill:var(--panel);stroke:var(--line);stroke-width:1;transition:fill .5s,stroke .3s}
.live-map text{font:500 11px var(--sans);fill:var(--text);text-anchor:middle;dominant-baseline:central;transition:fill .5s;pointer-events:none}
.live-map .look rect{stroke:var(--text);stroke-width:2}
.live-map .truth rect{stroke:var(--warn);stroke-width:2;stroke-dasharray:4 3}
.live-map .tag{font:500 10px var(--mono);fill:var(--warn)}
.live-side{padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-height:280px}
.live-step{margin:0;font-size:15px;min-height:48px}
.live-step .ph{display:block;font:400 12px var(--mono);color:var(--faint);margin-bottom:2px}
.live-bars{display:grid;gap:10px}
.lb{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font:400 13px var(--mono);color:var(--dim)}
.lb.top{color:var(--text)}
.lb i{grid-column:1/3;height:4px;border-radius:2px;background:var(--panel-2);overflow:hidden;display:block}
.lb i b{display:block;height:100%;background:var(--dim);border-radius:2px;transition:width .6s cubic-bezier(.3,.7,.2,1)}
.lb.top i b{background:var(--text)}
.live-verdict{border-top:1px solid var(--line);padding-top:14px;font-size:14.5px;color:var(--dim);animation:swap .35s ease-out}
.live-verdict .v{display:block;font:600 14px var(--mono);letter-spacing:.03em;margin-bottom:4px}
.live-verdict .v.ok{color:var(--accent)}
.live-verdict .v.hm{color:var(--text)}
.live-verdict .v.no{color:var(--warn)}
@keyframes swap{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.live-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;padding:12px 18px;border-top:1px solid var(--line);font:400 13px var(--mono);color:var(--faint)}
.live-foot a{font:500 14px var(--sans);color:var(--text);text-decoration:none}
.live-foot a:hover{text-decoration:underline}
@media (max-width:760px){
  .live-body{grid-template-columns:minmax(0,1fr)}
  .live-map{border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .live-side{min-height:0}
  .live-act button#lv-replay{display:none}
  .live-map text{font-size:12.5px}
  .live-map .tag{font-size:11px}
}


/* access */
.access{padding:44px 32px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);text-align:center}
.access h2{margin:0 auto}
.access .lead{margin:16px auto 0;text-wrap:balance}
.asks{display:inline-grid;gap:6px;margin:22px auto 0;padding:0;list-style:none;text-align:left;font:400 14.5px var(--mono);color:var(--dim)}
.asks li::before{content:"— ";color:var(--faint)}

/* footer */
footer{margin-top:120px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;padding-top:26px;padding-bottom:44px;font-size:14px;color:var(--faint)}
footer nav{display:flex;gap:24px}
footer a{text-decoration:none}
footer a:hover{color:var(--text)}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .path{grid-template-columns:minmax(0,1fr)}
  .path li:not(:last-child)::after{top:auto;bottom:-13px;right:auto;left:28px;width:1px;height:12px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .three,.two{grid-template-columns:minmax(0,1fr)}
  .two{gap:36px}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .top .wrap>nav .opt{display:none}
  .top .wrap>nav{gap:10px}
  .menu{display:inline-flex}
  .hero{padding-top:64px}
  .btn{width:100%}
  .ctas{flex-direction:column;align-items:stretch;max-width:420px;margin-left:auto;margin-right:auto}
  section{padding-top:96px}
  .facts{grid-template-columns:minmax(0,1fr)}
  th,td{padding-right:10px}
  th:first-child,td:first-child{padding-left:14px}
  table{font-size:14px}
